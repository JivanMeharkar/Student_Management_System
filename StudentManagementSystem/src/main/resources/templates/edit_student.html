<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Update Student</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body {
      background-image: url('/images/collage.png'); /* ✅ Image path */
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
      background-attachment: fixed;
      min-height: 100vh;
    }

    .card {
      background-color: rgba(255, 255, 255, 0.85);
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }

    label {
      font-weight: 500;
    }

    .card-header {
      background: linear-gradient(to right, #4b6cb7, #182848);
      font-weight: bold;
      font-size: 22px;
    }

    .btn-success {
      font-weight: bold;
    }
  </style>
</head>
<body>

<!-- ✅ Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="#">StudentManagementSystem</a>
  </div>
</nav>

<!-- ✅ Update Form Card -->
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow">
        <div class="card-header text-white text-center">
          Update Student
        </div>
        <div class="card-body">
          <form th:action="@{'/student/edit/' + ${student.id}}" th:object="${student}" method="post">

            <div class="form-group mb-3">
              <label>First Name</label>
              <input type="text" th:field="*{firstname}" class="form-control" placeholder="Enter first name" required>
            </div>

            <div class="form-group mb-3">
              <label>Last Name</label>
              <input type="text" th:field="*{lastname}" class="form-control" placeholder="Enter last name" required>
            </div>

            <div class="form-group mb-3">
              <label>Email</label>
              <input type="email" th:field="*{email}" class="form-control" placeholder="Enter email" required>
            </div>

            <button type="submit" class="btn btn-success w-100">Update Student</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
