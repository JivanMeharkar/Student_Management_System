<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Student Management System</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

  <style>
    body {
      background-image: url('/images/collage.png'); /* 📸 make sure file is in static/images/ */
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
      background-attachment: fixed;
    }

    .card {
      background-color: rgba(255, 255, 255, 0.9);
    }

    /* Transparent Table */
    .table,
    .table thead,
    .table tbody,
    .table tr,
    .table td,
    .table th {
      background-color: rgba(255, 255, 255, 0.6) !important;
      color: #000;
    }

    .table tr:hover {
      background-color: rgba(255, 255, 255, 0.8) !important;
    }

    .btn-sm {
      min-width: 80px;
    }
    footer {
  font-family: 'Segoe UI', sans-serif;
  font-size: 14px;
  letter-spacing: 0.5px;
}
  </style>
</head>
<body>

<!-- ✅ Stylish Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
  <div class="container d-flex justify-content-between align-items-center">
    <a class="navbar-brand fw-bold" href="#">StudentManagementSystem</a>
    <a th:href="@{/student/new}" class="btn btn-success btn-sm">
      <i class="bi bi-plus-circle"></i> Add Student
    </a>
  </div>
</nav>

<!-- ✅ Student List Card -->
<div class="container mt-5 d-flex justify-content-center">
  <div class="card shadow" style="min-width: 800px; max-width: 1000px; width: 100%;">

    <!-- Header -->
    <div class="card-header text-white text-center"
         style="background: linear-gradient(90deg, #2c3e50, #4b6584); font-size: 24px; font-weight: bold;">
      Student List
    </div>

    <!-- Table -->
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-striped table-bordered mb-0 text-center">
          <thead style="background-color: #2f3542; color: #ffffff;">
            <tr>
              <th scope="col">ID</th>
              <th scope="col">First Name</th>
              <th scope="col">Last Name</th>
              <th scope="col">Email</th>
              <th scope="col">Action</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="student : ${student}">
              <td th:text="${student.id}">1</td>
              <td th:text="${student.firstname}">John</td>
              <td th:text="${student.lastname}">Doe</td>
              <td th:text="${student.email}">john@example.com</td>
              <td>
                <a th:href="@{/student/edit/{id}(id=${student.id})}" class="btn btn-warning btn-sm">
                  <i class="bi bi-pencil-square"></i> Update
                </a>
                <a th:href="@{/student/{id}(id=${student.id})}" class="btn btn-danger btn-sm">
                  <i class="bi bi-trash"></i> Delete
                </a>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(student)}">
              <td colspan="5" class="text-muted">No students found.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>
</div>
<footer class="bg-dark text-white text-center py-3 mt-5 shadow-lg">
  <div class="container">
    &copy; 2025 Student Management System | Developed by <strong>Jivan Meharkar</strong>
  </div>
</footer>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
